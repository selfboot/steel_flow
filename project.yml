name: SteelFlow
options:
  bundleIdPrefix: com.steelflow
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  SteelFlow:
    type: application
    platform: iOS
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: SteelFlow
        LSApplicationCategoryType: public.app-category.utilities
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSSupportsOpeningDocumentsInPlace: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.steelflow.backup
            UTTypeDescription: SteelFlow Backup
            UTTypeConformsTo:
              - public.json
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - steelflowbackup
              public.mime-type: application/vnd.steelflow.backup+json
        CFBundleDocumentTypes:
          - CFBundleTypeName: SteelFlow Backup
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.steelflow.backup
    sources:
      - path: App
    resources:
      - path: App/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steelflow.app
        PRODUCT_NAME: SteelFlow
        INFOPLIST_KEY_CFBundleDisplayName: SteelFlow
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies: []
  SteelFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: SteelFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steelflow.tests
        GENERATE_INFOPLIST_FILE: YES
  SteelFlowUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: SteelFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steelflow.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SteelFlow:
    build:
      targets:
        SteelFlow: all
        SteelFlowTests: [test]
    test:
      targets:
        - SteelFlowTests
        - SteelFlowUITests
