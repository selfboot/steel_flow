name: SteelFlow
options:
  bundleIdPrefix: com.steelflow
  postGenCommand: ruby tools/patch_in_app_purchase_capability.rb
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    exactVersion: 5.85.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 4Z5Z5TE9EX
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 5
    MARKETING_VERSION: 1.0
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    REVENUECAT_ENTITLEMENT_ID: pro
    REVENUECAT_PROXY_URL: https://api.rc-backup.com/
targets:
  SteelFlow:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/RevenueCat.xcconfig
      Release: Config/RevenueCat.xcconfig
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: SteelFlow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        RevenueCatAPIKey: $(REVENUECAT_API_KEY)
        RevenueCatEntitlementID: $(REVENUECAT_ENTITLEMENT_ID)
        RevenueCatProxyURL: $(REVENUECAT_PROXY_URL)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSSupportsOpeningDocumentsInPlace: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.steelflow.backup
            UTTypeDescription: SteelFlow Backup
            UTTypeConformsTo:
              - public.json
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - steelflowbackup
              public.mime-type: application/vnd.steelflow.backup+json
        CFBundleDocumentTypes:
          - CFBundleTypeName: SteelFlow Backup
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.steelflow.backup
    sources:
      - path: App
    resources:
      - path: App/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steelflow.app
        PRODUCT_NAME: SteelFlow
        INFOPLIST_KEY_CFBundleDisplayName: SteelFlow
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - package: RevenueCat
        product: RevenueCat
    preBuildScripts:
      - name: Validate RevenueCat release configuration
        basedOnDependencyAnalysis: false
        script: /bin/sh "$SRCROOT/tools/validate_revenuecat_configuration.sh"
  SteelFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: SteelFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steelflow.tests
        GENERATE_INFOPLIST_FILE: YES
  SteelFlowUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: SteelFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steelflow.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SteelFlow:
    build:
      targets:
        SteelFlow: all
        SteelFlowTests: [test]
    test:
      storeKitConfiguration: SteelFlow.storekit
      targets:
        - SteelFlowTests
        - SteelFlowUITests
    run:
      config: Debug
      storeKitConfiguration: SteelFlow.storekit
